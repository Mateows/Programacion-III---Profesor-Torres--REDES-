<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Store | Panel Administrador</title>
    <script type="module" crossorigin src="/assets/admin-CiB2CPYk.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/navigate-CgFj1yLa.js">
    <link rel="modulepreload" crossorigin href="/assets/main-C2Y14KtS.js">
    <link rel="stylesheet" crossorigin href="/assets/style-C9PvAVaI.css">
  </head>
  <body>
    <!-- Barra de Navegación -->
    <header class="app-navbar">
      <div class="app-brand">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        <span>Food Store</span>
        <span class="app-brand__badge" style="background: linear-gradient(90deg, #ff7373, #ff416c);">Admin</span>
      </div>
      <div class="app-user-section">
        <div class="user-chip">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
          </svg>
          <span id="adminEmail">admin@foodstore.com</span>
        </div>
        <button id="logoutButton" type="button" class="btn-logout">Cerrar sesión</button>
      </div>
    </header>

    <main class="store-container">
      <section class="store-hero">
        <h1>Panel de Control de Administración</h1>
        <p>Gestión de usuarios y accesos autorizados del sistema Food Store.</p>
      </section>

      <h2>Usuarios Registrados</h2>
      <div class="admin-table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <!-- Se carga dinámicamente con home.ts -->
          </tbody>
        </table>
      </div>
    </main>

  </body>
</html>
